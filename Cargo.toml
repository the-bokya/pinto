[package]
name = "pinto"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
cosmic-text = "0.19.0"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
krilla = "0.8.2"
kuchikiki = "0.8.2"
lopdf = "0.44.0"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "sync"] }
tokio-tungstenite = "0.30.0"
